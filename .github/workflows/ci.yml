name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentforge
          POSTGRES_PASSWORD: agentforge
          POSTGRES_DB: agentforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentforge" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,postgres,docker]"
      - name: Lint
        run: ruff check app tests
      - name: Build sandbox image
        run: docker build -t agentforge-sandbox:latest ../sandbox
      - name: Unit + integration tests (Docker sandbox)
        env:
          AGENTFORGE_SANDBOX: docker
        run: pytest -q --cov=app --cov-report=term-missing
      - name: Migrations apply cleanly to PostgreSQL and match the models
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://agentforge:agentforge@localhost:5432/agentforge
        run: |
          alembic upgrade head
          alembic check
      - name: Static security scan
        run: bandit -q -r app -x app/agents/prompts -ll

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agentforge-api ./backend
      - run: docker build -t agentforge-dashboard ./frontend
      - run: docker build -t agentforge-sandbox ./sandbox

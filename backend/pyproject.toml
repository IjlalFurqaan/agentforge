[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge"
version = "0.1.0"
description = "Autonomous multi-agent software engineering platform (LangGraph + FastAPI)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "alembic>=1.14",
  "langgraph>=0.4",
  "langgraph-checkpoint-sqlite>=2.0",
  "anthropic>=0.70",
  "openai>=1.55",
  "httpx>=0.27",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "structlog>=24.4",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp-proto-http>=1.28",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "bandit>=1.7.10",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
postgres = [
  "asyncpg>=0.30",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary,pool]>=3.2",
]
docker = ["docker>=7.1"]
redis = ["redis>=5.2"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "respx>=0.21",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.agents" = ["prompts/*.md"]
"app.security_tools" = ["rules/*.yml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "live: hits a real LLM provider (skipped unless AGENTFORGE_LIVE_TESTS=1)",
  "sandbox: needs a working sandbox backend",
]
filterwarnings = ["ignore::DeprecationWarning:langsmith.*", "ignore::DeprecationWarning:passlib.*"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
# ASYNC109/240: explicit timeouts and small local filesystem calls are deliberate in this codebase.
ignore = ["S101", "S603", "S607", "B008", "RUF012", "ASYNC109", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S108", "E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true

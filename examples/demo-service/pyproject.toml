[project]
name = "taskboard-api"
version = "0.3.0"
description = "Small project/task tracking API used as the AgentForge demonstration repository"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
